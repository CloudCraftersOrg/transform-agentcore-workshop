apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{service_name}}-report
  labels:
    app.kubernetes.io/name: {{service_name}}
    app.kubernetes.io/component: report
spec:
  schedule: "{{report_schedule}}"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{service_name}}
            app.kubernetes.io/component: report
        spec:
          restartPolicy: Never
          serviceAccountName: {{service_name}}
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: {{image}}:{{image_tag}}
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.report"]
              envFrom:
                - configMapRef:
                    name: {{service_name}}-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{service_name}}-secrets
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
