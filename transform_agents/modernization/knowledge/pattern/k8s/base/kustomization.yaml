apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {{namespace}}
labels:
  - pairs:
      app.kubernetes.io/part-of: {{namespace}}
      app.kubernetes.io/managed-by: kustomize
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - cronjob-report.yaml
