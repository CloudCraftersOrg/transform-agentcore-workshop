apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{service_name}}
  labels:
    app.kubernetes.io/name: {{service_name}}
    app.kubernetes.io/component: api
spec:
  replicas: {{replicas_min}}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{service_name}}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{service_name}}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{service_name}}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{service_name}}
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{service_name}}
              app.kubernetes.io/component: api
      containers:
        - name: app
          image: {{image}}:{{image_tag}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{port}}
          envFrom:
            - configMapRef:
                name: {{service_name}}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{service_name}}-secrets
                  key: DATABASE_URL
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{service_name}}-secrets
                  key: ADMIN_TOKEN
          resources:
            requests:
              cpu: {{cpu_request}}
              memory: {{memory_request}}
            limits:
              cpu: {{cpu_limit}}
              memory: {{memory_limit}}
          startupProbe:
            httpGet:
              path: {{health_path}}
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{health_path}}
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{readiness_path}}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
