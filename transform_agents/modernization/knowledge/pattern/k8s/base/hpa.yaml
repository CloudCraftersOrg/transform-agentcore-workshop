apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{service_name}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{service_name}}
  minReplicas: {{replicas_min}}
  maxReplicas: {{replicas_max}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{cpu_target_pct}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
