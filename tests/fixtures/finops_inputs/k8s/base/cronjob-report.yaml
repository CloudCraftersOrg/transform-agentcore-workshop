apiVersion: batch/v1
kind: CronJob
metadata:
  name: inventory-report
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: inventory-service
          containers:
            - name: report
              image: inventory-service:1.0.0
              command: ["python", "-m", "app.report"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
