[project]
name = "transform-agents"
version = "0.1.0"
description = "AWS Transform-style migration agents rebuilt on Amazon Bedrock AgentCore with Strands Agents"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.61",
    "strands-agents-tools>=0.8",
    "bedrock-agentcore>=1.24",
    "boto3>=1.40",
    "pyyaml>=6.0",
    "python-hcl2>=7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transform_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls real AWS/Bedrock (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
extend-exclude = ["deploy/app", "deploy/.cli", "deploy/agentcore/cdk", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731"]
